const nb=document.getElementById("nb");if(nb){nb.value=S.n||"";nb.oninput=()=>{S.n=nb.value;save()}}}
document.addEventListener("change",e=>{const k=e.target.dataset.k;if(k){S.d[k]=e.target.checked;save();render()}const u=e.target.dataset.u;if(u!==undefined){S.u[u]=e.target.value;save()}});
document.addEventListener("click",e=>{const t=e.target.dataset.t;if(t){tab=t;fresh=true;render();window.scrollTo(0,0);return}
if(e.target.dataset.ev=="add"){const t=document.getElementById("et").value.trim(),u=document.getElementById("eu").value.trim();if(!t)return;(S.ev=S.ev||[]).push({c:document.getElementById("ec").value,t,u:(u.startsWith("https://")||u.startsWith("http://"))?u:"",d:Date.now()});save();render();return}
const x=e.target.dataset.evd;if(x!==undefined){S.ev.splice(+x,1);save();render();return}
const id=e.target.dataset.log;if(!id)return;const v=parseFloat(document.getElementById("m-"+id).value);if(!(v>0))return;(S.t[id]=S.t[id]||[]).push({m:v,ts:Date.now()});const q=ALLQ.find(x=>x.id==id);if(v<=TG[q.d])S.d[id]=true;save();render()});
render();
</script></body></html>
