function rowH(q){const b=best(q.id),ok=b<=TG[q.d];
return `<div class="row ${S.d[q.id]?"done":""}"><input type="checkbox" data-k="${q.id}" ${S.d[q.id]?"checked":""} aria-label="Solved"><span class="t"><a href="${url(q.s,q.r)}" target="_blank" rel="noopener">${q.t}</a></span><span class="b s">${SN[q.s]}</span><span class="b ${q.d}">${q.d=="E"?"Easy":q.d=="M"?"Medium":"Hard"} · ${TG[q.d]}m</span>
<span class="rr">${[3,7,21].map(n=>`<label><input type="checkbox" data-k="${q.id}-r${n}" ${S.d[q.id+"-r"+n]?"checked":""}>R${n}</label>`).join("")}</span>
<input type="number" min="1" id="m-${q.id}" placeholder="min" aria-label="Minutes"><button data-log="${q.id}">Log</button>
<span class="best" style="color:var(${b<1e9?(ok?"--ok":"--bad"):"--mu"})">${b<1e9?"best "+b+"m":"—"}</span></div>`}
function phase(p,num,op){const a=ids(p),d=a.filter(k=>S.d[k]).length;let b;
if(p.q)b=`<div class="rd"><div class="mu">CLRS reading</div>${p.r.map((x,j)=>L(p.id+"r"+j,tag(x))).join("")}</div>${p.q.map(rowH).join("")}<div class="rd" style="margin-top:12px">${L(p.id+"cp","<b>Checkpoint passed:</b> 4 random mediums, 40 minutes, no hints")}</div>`;
else b=`${p.read.length?`<h3>Read and watch</h3>`+p.read.map((x,j)=>L(p.id+"r"+j,x)).join(""):""}${p.ex.length?`<h3>Exercises (timed, 45 minutes each)</h3>`+p.ex.map((x,j)=>L(p.id+"e"+j,x)).join(""):""}<div class="pj"><b>${p.lab||"Build"}: ${p.t}</b> ${p.lab?"":`<span class="tag">uses ${p.ds}</span>`}${p.ms.map((x,j)=>L(p.id+"m"+j,x)).join("")}${p.lab?"":`<input type="url" data-u="${p.id}" value="${(S.u[p.id]||"").replace(/"/g,"")}" placeholder="Paste your repo link">`}</div>`;
return `<details data-p="${p.id}" ${op[p.id]?"open":""}><summary><h2>${num}. ${p.n}</h2><span class="mu">${p.w} · ${d}/${a.length} done${p.t?" · "+(p.lab||"project").toLowerCase()+": "+p.t:""}</span><div class="bar"><i style="width:${d/a.length*100}%"></i></div></summary><div class="body">${b}</div></details>`}
function plan(){let bars="";
for(const k in LISTS){const[d,t]=prog(LISTS[k]);bars+=`<div style="margin-top:10px">${CATN[k]} <span class="mu">${d}/${t}</span><div class="bar"><i style="width:${d/t*100}%"></i></div></div>`}
let md=0,mt=0;TL.forEach((b,i)=>b.c.forEach((x,j)=>{mt++;if(S.d["tl"+i+"c"+j])md++}));
bars+=`<div style="margin-top:10px">Timeline milestones <span class="mu">${md}/${mt}</span><div class="bar"><i style="width:${md/mt*100}%"></i></div></div>`;
const solved=ALLQ.filter(q=>S.d[q.id]).length,repos=Object.values(S.u).filter(Boolean).length;
return `<div class="card"><b>Progress</b>${bars}<div class="stats"><div><b>${solved}/${ALLQ.length}</b><span class="mu">problems solved</span></div><div><b>${repos}</b><span class="mu">project repos linked</span></div></div></div>
<div class="card"><h2>Weekly workload</h2><div class="mu">A normal week is about 19 hours, rising to about 22 once Spark starts in March 2027.</div><table><tr><th>Track</th><th>Hours</th><th>Shape</th></tr>${WK.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</table>
<p class="mu" style="margin:8px 0 0"><b>Minimum mode</b> for exam or heavy-coursework weeks: DSA 4 h, SQL 1 h, notebook 1 h, everything else paused. Never let DSA drop to zero for more than a week.</p></div>
<h2 style="margin-top:24px">Timeline</h2>${TL.map((b,i)=>`<div class="card"><h2>${b.n}</h2><span class="mu">${b.w}</span><ul>${b.f.map(x=>`<li>${x}</li>`).join("")}</ul><h3>Checkpoints</h3>${b.c.map((x,j)=>L("tl"+i+"c"+j,x)).join("")}</div>`).join("")}
<div class="card"><b>If you fall behind, cut in this order</b><ol class="mu"><li>The Codeforces track and the elite tier.</li><li>The depth of the Raft and Kafka projects (keep a working version).</li><li>The certification date, not the preparation.</li></ol><p class="mu" style="margin:8px 0 0">Protect: DSA reps, SQL, and at least the cache, LSM store, and Redis clone.</p></div>
<div class="card"><b>The 10-minute DSA protocol</b><ol class="mu"><li><b>0–2 min:</b> restate, ask about edge cases, name the pattern.</li><li><b>2–4 min:</b> state the approach and complexity aloud.</li><li><b>4–10 min:</b> code cleanly and dry-run one example.</li></ol><p class="mu" style="margin:8px 0 0">No approach after 5 minutes? Read the hint, then redo it cold after 3, 7 and 21 days. Always state the brute force first and write three edge cases before coding.</p></div>
<div class="card"><b>45-minute design interviews</b><ul class="mu"><li><b>High-level design:</b> 5 min requirements · 5 min estimation and API · 10 min data model and diagram · 15 min deep dive on two components · 10 min bottlenecks, failures, trade-offs.</li><li><b>Low-level design:</b> 5 min requirements · 10 min entities and relationships · 10 min patterns and class design · 15 min code the core · 5 min extensibility and concurrency.</li></ul></div>
<div class="card"><b>Bug-hunt method (30 minutes)</b><ul class="mu"><li>Reproduce first: run the app and tests, and trigger the failure before reading code.</li><li>Trace the request path: route, middleware, validation, handler, database call, response.</li><li>Check the usual suspects: missing await, wrong comparison, unvalidated input, missing authorization, non-atomic update, missing index.</li><li>Write a failing test, make the smallest fix, rerun everything, and explain the root cause aloud.</li></ul></div>
<div class="card"><b>Every project is done only when it has</b><ul class="mu"><li>A README with an architecture diagram and a design-decisions section.</li><li>Unit tests plus a randomized or fault-injection test.</li><li>A benchmark with real numbers and a note on what limited throughput.</li><li>A short write-up of what you would change, and the repo linked on its phase.</li></ul></div>`}
const EC=["Recognition","Open source","Technical impact","Innovation","Research","Recommendations"];
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])).replace(/"/g,"&quot;");
function evidence(){const ev=(S.ev||[]).map((e,i)=>({...e,i})).reverse();
return `<div class="card"><h2>Evidence log</h2><div class="mu">Record each piece of evidence when it happens: the date, a link, and what changed because of your work. When you need a portfolio, you choose the strongest ten from this log.</div>
<div class="stats">${EC.map(c=>`<div><b>${ev.filter(e=>e.c==c).length}</b><span class="mu">${c}</span></div>`).join("")}</div>
<div style="display:grid;gap:8px;margin-top:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))"><select id="ec">${EC.map(c=>`<option>${c}</option>`).join("")}</select><input type="text" id="et" placeholder="What happened, in one line"><input type="url" id="eu" placeholder="Link (PR, release, article, review)"><button data-ev="add">Add to log</button></div>
${ev.length?`<table><tr><th>Date</th><th>Category</th><th>Evidence</th><th></th></tr>${ev.map(e=>`<tr><td>${new Date(e.d).toLocaleDateString()}</td><td>${esc(e.c)}</td><td>${e.u?`<a href="${esc(e.u)}" target="_blank" rel="noopener">${esc(e.t)}</a>`:esc(e.t)}</td><td><button data-evd="${e.i}">Remove</button></td></tr>`).join("")}</table>`:""}
<p class="mu" style="margin:10px 0 0">If you ever use this for an endorsement application such as the UK Global Talent visa (digital technology), the GOV.UK pages I could find ask for a CV, three letters from established experts who have known your work for at least 12 months, and up to ten pieces of evidence, each up to three sides of A4 and not reusable across criteria. The CV and letters don’t count toward the ten. Check the current official criteria and take qualified immigration advice before relying on this.</p></div>`}
function logv(){const at=ALLQ.flatMap(q=>(S.t[q.id]||[]).map(a=>({...a,q}))).sort((a,b)=>b.ts-a.ts);
const win=ALLQ.filter(q=>best(q.id)<=TG[q.d]).length,avg=at.length?Math.round(at.reduce((s,a)=>s+a.m,0)/at.length*10)/10:0;
return `<div class="card"><h2>Timing log</h2><div class="stats"><div><b>${win}</b><span class="mu">within target time</span></div><div><b>${at.length}</b><span class="mu">attempts logged</span></div><div><b>${avg}m</b><span class="mu">average time</span></div></div></div>
<div class="card"><div class="mu" style="margin-bottom:8px">Latest 25 attempts</div><table>${at.length?`<tr><th>Date</th><th>Problem</th><th>Time</th><th>Target</th><th></th></tr>`+at.slice(0,25).map(a=>`<tr><td>${new Date(a.ts).toLocaleDateString()}</td><td>${a.q.t} (${SN[a.q.s]})</td><td>${a.m}m</td><td>${TG[a.q.d]}m</td><td style="color:var(${a.m<=TG[a.q.d]?"--ok":"--bad"})">${a.m<=TG[a.q.d]?"on target":"over"}</td></tr>`).join(""):`<tr><td class="mu">No attempts yet. Enter minutes on any DSA problem and press Log.</td></tr>`}</table></div>
<div class="card"><b>Notebook</b> <span class="mu">pattern notebook, mistake log, and design journal, saved in this browser</span><textarea id="nb" rows="10" placeholder="Two Sum → hash map, complement lookup, O(n). Trap: duplicate values."></textarea></div>`}
function render(){
const op={};document.querySelectorAll("details").forEach(d=>op[d.dataset.p]=d.open);
const first=fresh||!document.querySelector("details");fresh=false;
document.getElementById("nv").innerHTML=CATS.map(([k,n])=>`<button class="tb ${k==tab?"on":""}" data-t="${k}">${n}</button>`).join("");
const v=document.getElementById("v");
if(tab=="plan")v.innerHTML=plan();else if(tab=="log")v.innerHTML=logv();
else v.innerHTML=`<div class="mu">${DESC[tab]}</div>`+(tab=="imp"?evidence():"")+LISTS[tab].map((p,j)=>phase(p,j+1,first?(j==0?{[p.id]:1}:{}):op)).join("");
const nb=document.getElementById("nb");if(nb){nb.value=S.n||"";nb.oninput=()=>{S.n=nb.value;save()}}}
document.addEventListener("change",e=>{const k=e.target.dataset.k;if(k){S.d[k]=e.target.checked;save();render()}const u=e.target.dataset.u;if(u!==undefined){S.u[u]=e.target.value;save()}});
document.addEventListener("click",e=>{const t=e.target.dataset.t;if(t){tab=t;fresh=true;render();window.scrollTo(0,0);return}
if(e.target.dataset.ev=="add"){const t=document.getElementById("et").value.trim(),u=document.getElementById("eu").value.trim();if(!t)return;(S.ev=S.ev||[]).push({c:document.getElementById("ec").value,t,u:(u.startsWith("https://")||u.startsWith("http://"))?u:"",d:Date.now()});save();render();return}
const x=e.target.dataset.evd;if(x!==undefined){S.ev.splice(+x,1);save();render();return}
const id=e.target.dataset.log;if(!id)return;const v=parseFloat(document.getElementById("m-"+id).value);if(!(v>0))return;(S.t[id]=S.t[id]||[]).push({m:v,ts:Date.now()});const q=ALLQ.find(x=>x.id==id);if(v<=TG[q.d])S.d[id]=true;save();render()});
render();
</script></body></html>
